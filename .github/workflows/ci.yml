name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    env:
      PAYLOAD_SECRET: ci-secret-for-build-only
      DATABASE_URI: file:./ci-test.db
      PAYLOAD_PUSH_SCHEMA: 'false'
      NEXT_PUBLIC_SITE_URL: https://www.agricon.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate import map & types
        run: |
          pnpm payload generate:importmap
          pnpm payload generate:types

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      # Integration tests (vitest). These cover the pure logic that has no HTTP
      # surface: anti-spam heuristics, the rate limiter, i18n namespace parity,
      # JSON-LD builders and supplier-text cleaning. They need no populated
      # content database, so unlike the E2E suite they run here.
      - name: Integration tests
        run: pnpm test:int

      - name: Build
        run: pnpm build

      # E2E smoke tests are intentionally NOT run in CI: they require a populated
      # content database (test users + real blog posts such as /en/blog/layer-cage-guide),
      # which the ephemeral CI SQLite DB does not have. Run locally against a
      # populated DB with `pnpm test:e2e`.
