name: Deploy to Vercel

# Push-to-deploy production workflow. Requires a Vercel API token in the repo
# secret `VERCEL_TOKEN` (add it at Settings → Secrets and variables → Actions).
# Until the secret is set, the deploy steps are skipped with a warning.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_QndIkcpNjTARzSsZyENDs8kQ
      VERCEL_PROJECT_ID: prj_on0Q6uHEzzsyOrFLJrx4w8INvQlx
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: npx -y vercel@59.1.3 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: npx -y vercel@59.1.3 build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: npx -y vercel@59.1.3 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Skip notice (secret not set)
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: echo "::warning::VERCEL_TOKEN secret is not set — add it in repo Settings → Secrets and variables → Actions, then re-run this workflow or push again."
